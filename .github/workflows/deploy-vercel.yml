name: Deploy Showbizz Cars to Vercel

on:
  push:
    branches:
      - sync/xconversionlab-latest-2026-10-24
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: showbizz-vercel-${{ github.ref }}-${{ inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deployment skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as repository Actions secrets, then rerun this workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prevent production deployment from a non-main branch
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target == 'production' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production deployments are allowed only from main. Select Preview for this branch."
          exit 1

      - name: Check out source
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: npm ci

      - name: Pull Vercel preview settings
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target != 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target != 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target != 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Pull Vercel production settings
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target == 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target == 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: ${{ steps.credentials.outputs.configured == 'true' && inputs.target == 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
